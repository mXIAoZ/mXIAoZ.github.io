<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="addr-title addr-desc">
  <title id="addr-title">PagedAttention 地址翻译：逻辑块映射到离散物理块</title>
  <desc id="addr-desc">Request A 的逻辑块 0、1、2 通过 block table 完整映射到物理块 7、2、11。本轮 token 20 位于逻辑块 1 的 offset 4，最终写入物理块 2 的 offset 4，在简化单 cache group 示例中 slot 为 36。</desc>
  <defs>
    <marker id="addr-meta-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#2563EB"/>
    </marker>
    <style>
      text{font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;fill:#0F172A}
      .title{font-size:28px;font-weight:700}
      .subtitle{font-size:18px;fill:#475569}
      .section{font-size:17px;font-weight:700;letter-spacing:.8px;fill:#475569}
      .label{font-size:18px;font-weight:600}
      .body{font-size:18px}
      .note{font-size:17px;fill:#475569}
      .mono{font-family:"SFMono-Regular",Menlo,Consolas,monospace}
      .logical{fill:#F8FAFC;stroke:#94A3B8;stroke-width:1.5}
      .meta{fill:#EFF6FF;stroke:#2563EB;stroke-width:1.7;stroke-dasharray:7 6}
      .physical{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.8}
      .write{fill:#FFFBEB;stroke:#D97706;stroke-width:2}
      .meta-line{fill:none;stroke:#2563EB;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#addr-meta-arrow)}
      .rule{stroke:#CBD5E1;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1200" height="590" fill="#FFFFFF"/>
  <text class="title" x="48" y="44">逻辑连续，通过 block_table 映射到离散物理块</text>
  <text class="subtitle" x="48" y="76">Request A · block_size = 16 · 本轮定位 token 20</text>
  <line class="rule" x1="48" y1="96" x2="1152" y2="96"/>

  <text class="section" x="48" y="126">逻辑 TOKEN 序列</text>
  <text class="section mono" x="372" y="126">block_table[A]</text>
  <text class="section" x="770" y="126">对应的物理 KV BLOCK</text>

  <rect class="logical" x="48" y="146" width="250" height="72" rx="7"/>
  <text class="label" x="72" y="177">逻辑块 0</text>
  <text class="note" x="72" y="203">token 0–15</text>

  <rect class="logical" x="48" y="238" width="250" height="116" rx="7"/>
  <text class="label" x="72" y="268">逻辑块 1</text>
  <text class="note" x="72" y="292">token 16–31</text>
  <g aria-label="逻辑块 1 的 16 个 offset，offset 4 对应 token 20">
    <rect x="72" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="85" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="98" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="111" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect class="write" x="124" y="307" width="18" height="30" rx="3"/>
    <text class="note mono" x="133" y="329" text-anchor="middle" fill="#92400E">4</text>
    <rect x="145" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="158" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="171" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="184" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="197" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="210" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="223" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="236" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="249" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="262" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
    <rect x="275" y="310" width="10" height="24" fill="#F1F5F9" stroke="#94A3B8"/>
  </g>

  <rect class="logical" x="48" y="374" width="250" height="72" rx="7"/>
  <text class="label" x="72" y="405">逻辑块 2</text>
  <text class="note" x="72" y="431">token 32–47</text>

  <rect class="meta" x="372" y="146" width="246" height="72" rx="7"/>
  <text class="body mono" x="495" y="190" text-anchor="middle">A[0] → 7</text>
  <rect class="meta" x="372" y="260" width="246" height="72" rx="7"/>
  <text class="body mono" x="495" y="304" text-anchor="middle">A[1] → 2</text>
  <rect class="meta" x="372" y="374" width="246" height="72" rx="7"/>
  <text class="body mono" x="495" y="418" text-anchor="middle">A[2] → 11</text>

  <path class="meta-line" d="M298 182H366"/>
  <path class="meta-line" d="M298 296H366"/>
  <path class="meta-line" d="M298 410H366"/>

  <rect class="physical" x="770" y="146" width="356" height="72" rx="7"/>
  <text class="label mono" x="794" y="177">physical block 7</text>
  <text class="note" x="794" y="203">保存逻辑块 0 的 K/V</text>

  <rect class="physical" x="720" y="238" width="430" height="116" rx="7"/>
  <text class="label mono" x="744" y="268">physical block 2</text>
  <text class="note" x="744" y="292">offset 0</text>
  <text class="note" x="1126" y="292" text-anchor="end">offset 15</text>
  <g aria-label="物理块 2 的 16 个 slot，offset 4 即 slot 36">
    <rect x="744" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="768" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="792" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="816" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect class="write" x="840" y="307" width="28" height="34" rx="3"/>
    <text class="note mono" x="854" y="331" text-anchor="middle" fill="#92400E">4</text>
    <rect x="872" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="896" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="920" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="944" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="968" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="992" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="1016" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="1040" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="1064" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="1088" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
    <rect x="1112" y="310" width="20" height="28" fill="#FFFFFF" stroke="#0F766E"/>
  </g>

  <rect class="physical" x="770" y="374" width="356" height="72" rx="7"/>
  <text class="label mono" x="794" y="405">physical block 11</text>
  <text class="note" x="794" y="431">保存逻辑块 2 的 K/V</text>

  <path class="meta-line" d="M618 182H764"/>
  <path class="meta-line" d="M618 296H714"/>
  <path class="meta-line" d="M618 410H764"/>

  <rect class="write" x="720" y="466" width="430" height="70" rx="7"/>
  <text class="body mono" x="935" y="494" text-anchor="middle">token 20 → block 2, offset 4</text>
  <text class="body mono" x="935" y="522" text-anchor="middle">slot = 2 × 16 + 4 = 36</text>

  <line class="rule" x1="48" y1="554" x2="1152" y2="554"/>
  <text class="note" x="48" y="580">三行按逻辑块顺序对齐；物理 ID 7 → 2 → 11 明确表明这些块不要求连续。</text>
</svg>
