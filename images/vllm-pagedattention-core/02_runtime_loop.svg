<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="runtime-title runtime-desc">
  <title id="runtime-title">单个 Transformer layer 内分页 KV Cache 的读写契约</title>
  <desc id="runtime-desc">QKV projection 产生当前 Q、K、V。slot mapping 作为写地址指导本轮 K/V 写入分页 KV Cache；block table 和 sequence lengths 作为读取元数据指导 Attention 读取历史和当前 K/V。Q 直接作为本层临时输入，不持久化到 KV Cache。</desc>
  <defs>
    <marker id="runtime-neutral-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#475569"/>
    </marker>
    <marker id="runtime-meta-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#2563EB"/>
    </marker>
    <marker id="runtime-kv-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#0F766E"/>
    </marker>
    <marker id="runtime-write-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9Z" fill="#D97706"/>
    </marker>
    <style>
      text{font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;fill:#0F172A}
      .title{font-size:28px;font-weight:700}
      .subtitle{font-size:18px;fill:#475569}
      .section{font-size:17px;font-weight:700;letter-spacing:.8px;fill:#475569}
      .label{font-size:19px;font-weight:600}
      .body{font-size:18px}
      .note{font-size:17px;fill:#475569}
      .mono{font-family:"SFMono-Regular",Menlo,Consolas,monospace}
      .component{fill:#F8FAFC;stroke:#94A3B8;stroke-width:1.5}
      .meta{fill:#EFF6FF;stroke:#2563EB;stroke-width:1.7;stroke-dasharray:7 6}
      .cache{fill:#ECFDF5;stroke:#0F766E;stroke-width:1.8}
      .write-key{fill:#FFFBEB;stroke:#D97706;stroke-width:1.8}
      .layer{fill:none;stroke:#CBD5E1;stroke-width:1.4}
      .neutral-line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#runtime-neutral-arrow)}
      .meta-line{fill:none;stroke:#2563EB;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#runtime-meta-arrow)}
      .kv-line{fill:none;stroke:#0F766E;stroke-width:2.5;marker-end:url(#runtime-kv-arrow)}
      .write-line{fill:none;stroke:#D97706;stroke-width:2.5;marker-end:url(#runtime-write-arrow)}
      .rule{stroke:#CBD5E1;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text class="title" x="48" y="44">slot_mapping 写新增 KV，block_table 定位历史 KV</text>
  <text class="subtitle" x="48" y="76">这里只画单个 Transformer layer 的数据契约，不包含调度与采样。</text>
  <line class="rule" x1="48" y1="96" x2="1152" y2="96"/>

  <text class="section" x="48" y="126">MODEL RUNNER</text>
  <rect class="meta" x="300" y="108" width="260" height="72" rx="7"/>
  <text class="label mono" x="430" y="139" text-anchor="middle">slot_mapping</text>
  <text class="note" x="430" y="164" text-anchor="middle">本轮新 K/V 的写地址</text>
  <rect class="meta" x="680" y="108" width="340" height="72" rx="7"/>
  <text class="label mono" x="850" y="139" text-anchor="middle">block_table + seq_lens</text>
  <text class="note" x="850" y="164" text-anchor="middle">分页读取顺序与有效长度</text>

  <rect class="layer" x="48" y="208" width="1104" height="284" rx="8"/>
  <text class="section" x="72" y="240">ONE TRANSFORMER LAYER</text>

  <rect class="component" x="76" y="276" width="230" height="158" rx="7"/>
  <text class="label" x="100" y="310">QKV Projection</text>
  <text class="body mono" x="100" y="345">Q = XWq</text>
  <text class="body mono" x="100" y="376">K = XWk</text>
  <text class="body mono" x="100" y="407">V = XWv</text>

  <rect class="cache" x="466" y="292" width="284" height="126" rx="7"/>
  <text class="label" x="608" y="326" text-anchor="middle">Paged KV Cache</text>
  <text class="body" x="608" y="358" text-anchor="middle">历史 K/V + 本轮新 K/V</text>
  <text class="note" x="608" y="389" text-anchor="middle">固定大小的物理 block 池</text>

  <rect class="component" x="878" y="276" width="214" height="158" rx="7"/>
  <text class="label" x="985" y="310" text-anchor="middle">Attention</text>
  <text class="body" x="985" y="346" text-anchor="middle">Q × Kᵀ</text>
  <text class="body" x="985" y="377" text-anchor="middle">Softmax × V</text>
  <text class="note" x="985" y="407" text-anchor="middle">产生本层输出 O</text>

  <path class="neutral-line" d="M306 326H352V254H844V326H872"/>
  <text class="note mono" x="600" y="248" text-anchor="middle">Q · 本层临时输入，不进入 KV Cache</text>

  <path class="write-line" d="M306 386H460"/>
  <rect class="write-key" x="333" y="354" width="104" height="26" rx="5"/>
  <text class="note" x="385" y="373" text-anchor="middle" fill="#92400E">① 写 K/V</text>

  <path class="meta-line" d="M430 180V224H420V348"/>
  <text class="note mono" x="334" y="220" fill="#1D4ED8">write address</text>

  <path class="kv-line" d="M750 386H872"/>
  <text class="note" x="811" y="374" text-anchor="middle" fill="#0F766E">② 读 K/V</text>

  <path class="meta-line" d="M850 180V224H985V270"/>
  <text class="note mono" x="864" y="220" fill="#1D4ED8">read indirection</text>

  <path class="neutral-line" d="M1092 355H1134"/>
  <text class="label mono" x="1143" y="361">O</text>

  <line class="rule" x1="48" y1="518" x2="1152" y2="518"/>
  <text class="note" x="48" y="548">历史 KV 保持在原物理块中；Attention 通过地址元数据恢复每个请求的逻辑顺序。</text>
</svg>
